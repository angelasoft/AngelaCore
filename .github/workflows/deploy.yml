name: Deploy AngelaCore

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-angela-core
  cancel-in-progress: false

env:
  DEPLOY_HOST: 13.209.118.5
  DEPLOY_USER: ubuntu
  DEPLOY_DIR: angela-core
  API_DOMAIN: api.angelasoft.com
  ADMIN_DOMAIN: admin.angelasoft.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon test bootJar

      - name: Assemble release
        env:
          ACME_EMAIL: angelasoft@angelasoft.com
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: angela
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          cp build/libs/app.jar deploy/app.jar
          # 작은따옴표로 감싸 compose 가 값 안의 $ 를 변수로 해석하지 않게 한다 (값에 ' 는 쓸 수 없음)
          for key in API_DOMAIN ADMIN_DOMAIN ACME_EMAIL DB_URL DB_USERNAME DB_PASSWORD JWT_SECRET \
                     KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET ADMIN_EMAILS; do
            printf "%s='%s'\n" "$key" "${!key}"
          done > deploy/.env

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and restart
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/$DEPLOY_DIR/admin-dist"
          rsync -az --delete --exclude 'admin-dist/' -e "$SSH" deploy/ "$DEPLOY_USER@$DEPLOY_HOST:~/$DEPLOY_DIR/"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "cd ~/$DEPLOY_DIR && chmod 600 .env && docker compose up -d --build --remove-orphans && docker image prune -f"

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$API_DOMAIN/api/health"; then exit 0; fi
            sleep 5
          done
          echo "Health check failed"
          exit 1
