# Lightsail 운영 구성: AngelaCore + Caddy(HTTPS, AngelaAdmin 정적 파일). DB는 Lightsail 관리형 PostgreSQL.
# GitHub Actions(.github/workflows/deploy.yml)가 app.jar 와 .env 를 함께 서버 ~/angela-core 로 보내고 실행한다.
services:
  core:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      CORS_ALLOWED_ORIGINS: https://${ADMIN_DOMAIN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 900m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - core
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./admin-dist:/srv/admin:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
