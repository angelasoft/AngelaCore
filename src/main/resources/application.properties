spring.application.name=AngelaCore

# Local default: in-memory H2 (override with env-specific config for production DB)
spring.datasource.url=jdbc:h2:mem:angelacore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# JWT
app.jwt.secret=change-this-to-a-long-secret-key-for-jwt-signing-please-change
app.jwt.access-token-expiration-seconds=3600
app.jwt.cookie-name=ANGELA_ADMIN_AT

# Mobile(AngelaMobile) OAuth 콜백 딥링크 스킴
app.mobile.oauth-redirect-uri=angela://oauth/callback

# Comma-separated admin emails (example: admin1@angelasoft.com,admin2@angelasoft.com)
app.admin.emails=
