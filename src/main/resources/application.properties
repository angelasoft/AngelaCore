spring.application.name=AngelaCore

# 프로필을 지정하지 않으면 로컬 개발(local). 운영은 SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# 리버스 프록시(Caddy) 뒤에서 X-Forwarded-* 헤더로 https 원본 주소를 복원 (OAuth redirect_uri 생성에 필요)
server.forward-headers-strategy=native

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-seconds=3600
app.jwt.cookie-name=ANGELA_ADMIN_AT

# 쿠키 Secure 속성 (https 운영에서는 true)
app.cookie.secure=false

# CORS 허용 Origin 패턴 (콤마 구분)
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*

# Mobile(AngelaMobile) OAuth 콜백 딥링크 스킴
app.mobile.oauth-redirect-uri=angela://oauth/callback

# Comma-separated admin emails (example: admin1@angelasoft.com,admin2@angelasoft.com)
app.admin.emails=${ADMIN_EMAILS:}
