# 로컬 개발: 인메모리 H2
spring.datasource.url=jdbc:h2:mem:angelacore;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# 로컬 시크릿(OAuth client id/secret, JWT_SECRET)은 Git에 올리지 않는 파일에서 읽는다.
# local-secrets.properties.example 을 복사해 src/main/resources/local-secrets.properties 로 만든다.
spring.config.import=optional:classpath:local-secrets.properties
